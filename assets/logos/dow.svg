<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 80" width="300" height="80">
  <!-- Dow Red Diamond Container -->
  <g transform="translate(15, 6)">
    <!-- Red Diamond -->
    <polygon points="65,2 128,32 65,62 2,32" fill="#E51937"/>
    <!-- DOW Text inside diamond -->
    <text x="65" y="42" font-family="'Montserrat', 'Arial Black', sans-serif" font-weight="900" font-size="28" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">DOW</text>
    <!-- Registered Symbol -->
    <text x="120" y="24" font-family="sans-serif" font-size="8" fill="#FFFFFF">®</text>
  </g>

  <!-- Text Dow AgroSciences below -->
  <text x="80" y="74" font-family="'Open Sans', sans-serif" font-weight="700" font-size="14" fill="#222222" text-anchor="middle">Dow AgroSciences</text>
</svg>
